<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F4">
  <title>LakaSG – Phán xét quán Sài Gòn theo gu</title>
  <meta name="description" content="Chọn gu, LakaSG phán quán cà phê, quán ăn TP.HCM đang mở cửa, số sao và review lấy từ Google Maps.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F4; --cream2: #F4EFE6; --line: #EAE1D2;
      --sage: #2D5A40; --sage-soft: #E3EDE6; --mocha: #2B221C; --mocha2: #3D312A;
      --muted: #7A6B5F; --gold: #E8A317; --rose: #C2410C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; height: 100dvh; width: 100%;
      overflow: hidden; overscroll-behavior: none;
      background: var(--cream); color: var(--mocha2);
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .app {
      height: 100dvh; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column;
      padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
    }
    .noscroll::-webkit-scrollbar { display: none; }
    .noscroll { scrollbar-width: none; }

    /* ---------- header ---------- */
    .top { display: flex; align-items: center; gap: 10px; flex: none; }
    .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--sage); color: #fff;
      display: grid; place-items: center; font-weight: 800; font-size: 17px; flex: none; }
    .brand { flex: 1; min-width: 0; }
    .brand b { display: block; font-size: 18px; font-weight: 800; color: var(--mocha); line-height: 1.1; }
    .brand span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid var(--line);
      display: grid; place-items: center; font-size: 17px; flex: none; }
    .icon-btn:active, .chip:active, .cta:active, .opt:active { transform: scale(.96); }

    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* ---------- quiz ---------- */
    .quiz { justify-content: space-between; padding-top: 2vh; gap: 1.6vh; }
    .q-title { font-size: clamp(22px, 6.4vw, 28px); font-weight: 800; color: var(--mocha); line-height: 1.2; }
    .q-title em { font-style: normal; color: var(--sage); }
    .q-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .q-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .q-label small { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--sage); }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .opt { border: 2px solid var(--line); background: #fff; border-radius: 16px; padding: 1.4vh 12px;
      display: flex; align-items: center; gap: 10px; text-align: left; transition: .15s; }
    .opt .e { font-size: 24px; }
    .opt b { display: block; font-size: 15px; font-weight: 700; }
    .opt span { display: block; font-size: 11.5px; color: var(--muted); }
    .opt.on { border-color: var(--sage); background: var(--sage-soft); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff;
      font-size: 14px; font-weight: 600; transition: .15s; }
    .chip.on { background: var(--sage); border-color: var(--sage); color: #fff; }
    .purpose { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .purpose .opt { flex-direction: column; text-align: center; gap: 4px; padding: 1.6vh 6px; }
    .cta { width: 100%; padding: 16px; border-radius: 18px; background: var(--mocha); color: #fff;
      font-size: 16px; font-weight: 700; box-shadow: 0 8px 20px rgba(43,34,28,.18); transition: .15s; }
    .cta:disabled { opacity: .4; }
    .foot { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }

    /* ---------- results ---------- */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 8px; flex: none; scroll-behavior: smooth; }
    .tab { flex: none; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff;
      font-size: 13px; font-weight: 600; white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }
    .tab.on { background: var(--mocha); border-color: var(--mocha); color: #fff; }
    .deck { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; gap: 12px; margin: 0 -14px; padding: 0 14px; scroll-padding: 0 14px;
      overscroll-behavior-x: contain; }
    .card { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; min-height: 0;
      background: #fff; border: 1px solid var(--line); border-radius: 24px; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 4px 18px rgba(61,49,42,.06); }
    .hero { position: relative; flex: 1 1 auto; min-height: 92px; padding: 14px 16px;
      display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
    .hero .rank { align-self: flex-start; background: rgba(255,255,255,.22); backdrop-filter: blur(4px);
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .hero .emoji { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: clamp(54px, 18vw, 90px); opacity: .9; }
    .hero h2 { font-size: clamp(20px, 5.8vw, 25px); font-weight: 800; line-height: 1.15; max-width: 78%; text-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .hero .cat { font-size: 13px; opacity: .92; margin-top: 2px; }
    .body { flex: 0 0 auto; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
    .gg { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stars { font-size: 20px; font-weight: 800; color: var(--mocha); display: flex; align-items: center; gap: 4px; }
    .stars i { font-style: normal; color: var(--gold); }
    .rev { font-size: 13px; color: var(--muted); }
    .open { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--sage); background: var(--sage-soft);
      padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
    .verdict { background: var(--cream2); border-radius: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.45; color: var(--mocha2); }
    .verdict b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--rose); margin-bottom: 2px; }
    .bars { display: grid; gap: 6px; }
    .bar { display: grid; grid-template-columns: 92px 1fr 30px; align-items: center; gap: 8px; font-size: 13px; }
    .bar .t { height: 8px; background: var(--cream2); border-radius: 99px; overflow: hidden; }
    .bar .t div { height: 100%; background: var(--sage); border-radius: 99px; }
    .bar.hl span:first-child { font-weight: 700; color: var(--sage); }
    .bar b { text-align: right; font-weight: 700; }
    .addr { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { padding: 12px 8px; border-radius: 14px; font-size: 14px; font-weight: 700; text-align: center; display: block; }
    .btn.p { background: var(--sage); color: #fff; }
    .btn.s { background: #fff; border: 1.5px solid var(--line); color: var(--mocha2); }
    .pager { flex: none; display: flex; align-items: center; justify-content: space-between; padding-top: 8px; font-size: 12px; color: var(--muted); }
    .dots { display: flex; gap: 5px; }
    .dots span { width: 6px; height: 6px; border-radius: 9px; background: var(--line); transition: .2s; }
    .dots span.on { width: 18px; background: var(--mocha); }
    .empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 15px; padding: 20px; }

    /* màn nhỏ / thấp: thu gọn để vẫn vừa 1 màn hình */
    @media (max-height: 700px) {
      .quiz { padding-top: 0; }
      .q-sub, .opt span:not(.e) { display: none; }
      .opt .e { font-size: 20px; }
      .chip { padding: 7px 12px; font-size: 13px; }
      .cta { padding: 13px; }
      .body { gap: 7px; padding: 10px 14px 12px; }
      .verdict { font-size: 13px; padding: 8px 10px; }
      .bar { font-size: 12px; }
      .btn { padding: 10px 6px; }
    }
    @media (max-height: 600px) {
      .bars .bar:not(.hl) { display: none; }
      .addr { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <button id="btn-back" class="icon-btn hidden" aria-label="Chọn lại gu">←</button>
      <div class="logo" id="logo">L</div>
      <div class="brand">
        <b>LakaSG</b>
        <span id="sub">Phán quán Sài Gòn theo gu của anh</span>
      </div>
      <button id="btn-share" class="icon-btn" aria-label="Chia sẻ">↗</button>
    </header>

    <!-- MÀN 1: CHỌN GU -->
    <main id="quiz" class="screen quiz">
      <div>
        <h1 class="q-title">Hôm nay anh muốn <em>đi đâu</em>?</h1>
        <p class="q-sub">Chọn gu, LakaSG phán quán hợp nhất. Chỉ quán đang mở cửa trên Google Maps.</p>
      </div>

      <section>
        <div class="q-label">Loại quán</div>
        <div class="seg" id="type">
          <button class="opt on" data-v="cafe"><span class="e">☕</span><div><b>Cà phê</b><span>Ngồi, làm việc, hẹn hò</span></div></button>
          <button class="opt" data-v="food"><span class="e">🍜</span><div><b>Quán ăn</b><span>Ăn ngon, đi nhóm</span></div></button>
        </div>
      </section>

      <section>
        <div class="q-label">Khu vực <small id="dcount">Tất cả 5 khu</small></div>
        <div class="chips" id="districts">
          <button class="chip" data-v="Quận 1">Quận 1</button>
          <button class="chip" data-v="Quận 3">Quận 3</button>
          <button class="chip" data-v="Bình Thạnh">Bình Thạnh</button>
          <button class="chip" data-v="Phú Nhuận">Phú Nhuận</button>
          <button class="chip" data-v="Thảo Điền">Thảo Điền</button>
        </div>
      </section>

      <section>
        <div class="q-label">Đi để làm gì?</div>
        <div class="purpose" id="purpose">
          <button class="opt on" data-v="work"><span class="e">💻</span><b>Làm việc</b><span>Yên, ngồi lâu</span></button>
          <button class="opt" data-v="chill"><span class="e">💞</span><b>Chill / hẹn</b><span>Đẹp, thư giãn</span></button>
          <button class="opt" data-v="taste"><span class="e">😋</span><b>Ăn uống ngon</b><span>Vị là trên hết</span></button>
        </div>
      </section>

      <div>
        <button class="cta" id="go">Phán xét giúp em →</button>
        <p class="foot" id="foot"></p>
      </div>
    </main>

    <!-- MÀN 2: KẾT QUẢ – trượt ngang -->
    <main id="results" class="screen hidden">
      <nav class="tabs noscroll" id="tabs"></nav>
      <div class="deck noscroll" id="deck"></div>
      <div class="pager">
        <span id="count">1 / 1</span>
        <div class="dots" id="dots"></div>
        <span>Trượt ngang ⇆</span>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
